name: AWO Release Readiness

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AWO_ADMIN_PASSWORD: test
      AWO_ADMIN_SESSION_TOKEN: test
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install dependencies
        run: npm ci

      - name: Run release readiness
        id: release
        continue-on-error: true
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:release

      - name: Summarize release failure
        if: steps.release.outcome == 'failure'
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const reportPath = '.qa/release-readiness/latest.json';
          if (!fs.existsSync(reportPath)) {
            console.log('::error title=Release readiness failed::No release report was written.');
            process.exit(1);
          }
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const failed = report.steps.find((step) => step.status === 'failed');
          const message = failed
            ? `${failed.name} failed. ${String(failed.outputTail || '').slice(-900)}`
            : report.error || 'Release readiness failed.';
          const safe = message.replace(/\r?\n/g, ' ').replace(/%/g, '%25');
          console.log(`::error title=Release readiness failed::${safe}`);
          process.exit(1);
          NODE

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          include-hidden-files: true
          name: qa-evidence
          path: .qa/
